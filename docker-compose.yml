# Local stack: Postgres, 2 orchestrators, 3 workers, Toxiproxy, Prometheus,
# Grafana and Jaeger (traces over OTLP).
# The orchestrators reach Postgres through Toxiproxy so the chaos suite can
# inject latency and partitions (SPEC 6.5). Credentials are local-dev only.

x-baton: &baton
  build:
    context: .
    target: baton
  image: baton:dev
  restart: unless-stopped
  depends_on:
    toxiproxy:
      condition: service_started
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/usr/local/bin/baton", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 5

x-baton-env: &baton-env
  BATON_DATABASE_URL: postgres://baton:baton@toxiproxy:15432/baton?sslmode=disable
  BATON_HTTP_ADDR: ":8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton
      POSTGRES_DB: baton
    ports: ["${BATON_PG_HOST_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 2s
      timeout: 3s
      retries: 15

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: [./deploy/toxiproxy:/config:ro]
    ports: ["8474:8474"]

  baton-1:
    <<: *baton
    hostname: baton-1
    environment:
      <<: *baton-env
      BATON_REPLICA_ID: baton-1
      BATON_ADVERTISE_ADDR: http://baton-1:8080
    ports: ["8081:8080"]

  baton-2:
    <<: *baton
    hostname: baton-2
    environment:
      <<: *baton-env
      BATON_REPLICA_ID: baton-2
      BATON_ADVERTISE_ADDR: http://baton-2:8080
    ports: ["8082:8080"]

  baton-worker:
    build:
      context: .
      target: baton-worker
    image: baton-worker:dev
    restart: unless-stopped
    deploy:
      replicas: 3
    stop_grace_period: 30s
    environment:
      BATON_ADDR: http://baton-2:8080,http://baton-1:8080
      BATON_WORKER_QUEUES: default
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      baton-1:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports: ["16686:16686"]   # UI; OTLP/HTTP on 4318 inside the network

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
